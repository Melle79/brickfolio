services:
  brickfolio:
    # Fertiges Image – nichts zu bauen, kein Quellcode nötig.
    # Wer lieber selbst baut (eigene Änderungen), ersetzt die Zeile durch:
    #   build: .
    #
    # `latest` heißt: Jedes Update zieht den neuesten Stand – bequem, aber
    # es bedeutet auch Vertrauen in die Registry. Wer das nicht will, trägt
    # eine feste Version ein, z. B.:
    #   image: ghcr.io/melle79/brickfolio:1.67.0
    # Achtung: Das legt nur den *Namen* fest. Gegen eine übernommene Registry
    # hilft erst ein Digest, denn der beschreibt den Inhalt selbst:
    #   image: ghcr.io/melle79/brickfolio@sha256:7efb9eb03038cb89f…
    # Dann läuft nur, was du selbst ausgewählt hast. Der Preis: Der
    # Update-Knopf in der App bewirkt nichts mehr – `docker compose pull`
    # holt bei einer festen Version denselben Stand. Aktualisieren heißt
    # dann: Zeile ändern, `docker compose up -d`.
    image: ghcr.io/melle79/brickfolio:latest
    container_name: brickfolio
    restart: unless-stopped
    ports:
      - "8300:8300"
    volumes:
      - ./data:/data
    environment:
      # **Nicht optional, auch wenn alles darunter es ist.** Ohne sie läuft
      # der Container in UTC, und das merkt man erst spät: Zeitstempel in der
      # Fehlerliste und in automatisch angelegten GitHub-Issues stehen dann
      # zwei Stunden neben der eigenen Uhr (`main.py` rechnet sie mit
      # `time.localtime` um). Am 19.08.2026 hat genau das die Suche nach
      # einem Fehler ins falsche Zeitfenster geschickt.
      TZ: "Europe/Berlin"
    # Alle weiteren Umgebungsvariablen sind optional – ohne sie führt die App beim
    # ersten Aufruf durch die Ersteinrichtung im Browser (empfohlen) – die
    # API-Schlüssel fragt der Assistent dort gleich mit ab.
    # Zum Aktivieren: den environment-Block einkommentieren.
    #
    # environment:
    #   # Admin automatisch anlegen (für unbeaufsichtigte Setups):
    #   ADMIN_USER: "admin"
    #   ADMIN_PASSWORD: "bitte-aendern"
    #   # BrickLink-API (https://www.bricklink.com/v2/api/register_consumer.page):
    #   BL_CONSUMER_KEY: ""
    #   BL_CONSUMER_SECRET: ""
    #   BL_TOKEN: ""
    #   BL_TOKEN_SECRET: ""
    #   # Rebrickable-API (https://rebrickable.com/api/):
    #   REBRICKABLE_KEY: ""
    #   # Optional: lokale KI (Ollama) uebersetzt erfolglose deutsche
    #   # Suchbegriffe ins Englische – die Sammlungsnamen von BrickLink
    #   # sind englisch, „Ritter" findet sonst den „Knight" nicht.
    #   # Leer lassen = aus; die App verhaelt sich dann wie bisher.
    #   OLLAMA_URL: ""
    #   OLLAMA_MODEL: "qwen2.5:14b"
