name: Docker-Image bauen

# Damit muss niemand mehr den Quellcode holen und selbst bauen: ein
# `docker compose up -d` zieht das fertige Image. Gebaut wird für amd64
# (Synology, Intel-NAS, PC) und arm64 (Raspberry Pi, ARM-NAS, Apple).
on:
  push:
    branches: [main]
    # Der Katalog-Index ist **Daten**, kein Code. Er wird nach jedem
    # Kataloglauf neu geschrieben – ohne diesen Filter liefe bei jeder
    # Veröffentlichung die ganze Testsuite und, schlimmer, ein neuer
    # Image-Bau. Die Instanzen sähen dann eine „neue Version" für eine
    # Änderung, die sie über den Index ohnehin bekommen.
    paths-ignore:
      - "katalog/**"
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: QEMU einrichten (für arm64)
        uses: docker/setup-qemu-action@v3

      - name: Buildx einrichten
        uses: docker/setup-buildx-action@v3

      - name: An der GitHub-Registry anmelden
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Zusätzlich Docker Hub – nur, wenn die Zugangsdaten hinterlegt sind.
      # Grund: Synologys Container Manager durchsucht Docker Hub. Die
      # GitHub-Registry lässt sich nicht durchsuchen (kein offener Katalog),
      # dort kann man nur den vollen Namen ziehen.
      - name: An Docker Hub anmelden
        id: hub
        if: vars.DOCKERHUB_USER != ''
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Marken: `main` folgt dem Entwicklungsstand, `latest` und die
      # Versionsnummern entstehen nur aus Releases – wer `latest` einsetzt,
      # bekommt also nichts Halbfertiges.
      #
      # Vorabversionen sind ausdrücklich ausgenommen: Ein als Prerelease
      # veröffentlichtes 1.60.0-beta.1 hat `latest` mitgenommen und wäre so
      # bei allen gelandet, die einfach `latest` ziehen. Betas bekommen
      # deshalb ihre eigene Marke `beta`; wer sie sehen will, holt sie sich.
      - name: Marken festlegen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/brickfolio
            ${{ vars.DOCKERHUB_USER != '' && format('docker.io/{0}/brickfolio', vars.DOCKERHUB_USER) || '' }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.event_name == 'release' && github.event.release.prerelease == false }}
            type=raw,value=beta,enable=${{ github.event_name == 'release' && github.event.release.prerelease == true }}

      - name: Bauen und veröffentlichen
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Hinweis: Die Beschreibungsseite auf Docker Hub wird NICHT von hier
      # gesetzt. Docker Hub verlangt dafür einen Token mit
      # „read/write/delete" – der dürfte also auch Images löschen. So etwas
      # für eine Textseite in die CI zu legen, ist das Risiko nicht wert;
      # der Token hier darf nur schieben.
      #
      # Der Text steht in docs/DOCKERHUB.md und wird bei Bedarf von Hand in
      # die Repository-Einstellungen auf Docker Hub eingefügt. Er ändert sich
      # selten – und ein Schritt, der still nichts tut, wäre schlimmer als
      # gar keiner.
