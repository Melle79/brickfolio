name: Tests

on:
  push:
    branches: [main]
    # Der Katalog-Index ist **Daten**, kein Code. Er wird nach jedem
    # Kataloglauf neu geschrieben – ohne diesen Filter liefe bei jeder
    # Veröffentlichung die ganze Testsuite und, schlimmer, ein neuer
    # Image-Bau. Die Instanzen sähen dann eine „neue Version" für eine
    # Änderung, die sie über den Index ohnehin bekommen.
    paths-ignore:
      - "katalog/**"
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Tests ausführen
        run: python -m pytest
