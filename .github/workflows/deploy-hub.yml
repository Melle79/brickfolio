name: Hub veröffentlichen

# Der Tausch-Hub (Cloudflare Worker) wird automatisch neu veröffentlicht,
# sobald sich unter hub/ etwas ändert. Dafür braucht das Repo ein Secret:
#   CLOUDFLARE_API_TOKEN  (Dashboard → My Profile → API Tokens →
#                          Vorlage "Edit Cloudflare Workers")
#   CLOUDFLARE_ACCOUNT_ID (Dashboard → Workers & Pages → rechts in der Leiste)
#
# Ohne die Secrets überspringt der Lauf sich selbst, statt rot zu werden.

on:
  push:
    branches: [main]
    paths:
      - "hub/**"
      - ".github/workflows/deploy-hub.yml"
  workflow_dispatch:        # von Hand auslösbar

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Secrets vorhanden?
        id: check
        run: |
          if [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN fehlt – Veröffentlichen übersprungen."
          fi

      - name: Node einrichten
        if: steps.check.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Erst die Datenbank, dann den Code: sonst läuft neuer Code gegen ein
      # altes Schema (fehlende Tabelle = Fehler in der Oberfläche).
      # Schon angewandte Schritte melden „duplicate column“ o. Ä. – das ist
      # erwartet und darf den Lauf nicht abbrechen.
      - name: Datenbank-Erweiterungen anwenden
        if: steps.check.outputs.ready == 'true'
        working-directory: hub
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          shopt -s nullglob
          for f in migrations/*.sql; do
            echo "::group::$f"
            npx --yes wrangler@4 d1 execute brickfolio-hub --remote --file="$f" \
              || echo "::notice::$f war schon angewandt (oder teilweise) – weiter"
            echo "::endgroup::"
          done

      - name: Worker veröffentlichen
        if: steps.check.outputs.ready == 'true'
        working-directory: hub
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
