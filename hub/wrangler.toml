name = "brickfolio-hub"
main = "src/index.js"
compatibility_date = "2025-07-01"

# Der Catch-all in `src/index.js` schreibt jede Ausnahme mit `console.error`
# ins Protokoll und antwortet nach außen nur mit „interner Fehler" – bewusst,
# damit kein Innenleben nach draußen geht. Ohne diesen Block behält Cloudflare
# das Protokoll aber nicht: Sichtbar wäre es allein für den, der zufällig
# gerade `wrangler tail` laufen lässt. Am 13.08.2026 ließ sich deshalb nicht
# mehr klären, woran ein 500 lag – die Instanz meldete einen 502, und auf
# beiden Seiten war der Grund weg.
[observability]
enabled = true

# Der Katalogabzug laeuft jetzt hier statt in jeder Instanz. Alle 15 Minuten,
# nicht oefter: Die BrickLink-Abrufe teilen sich das Tageskontingent (5.000)
# mit den Preisabfragen der Instanzen. 20 Abrufe je Lauf sind rund 1.900 am
# Tag – genug Luft, und der Abzug ist ohnehin fertig; hier geht es um
# Nachschub, nicht um den Erstaufbau.
[triggers]
crons = ["*/15 * * * *"]

# Workers AI beschreibt die Bilder neuer Figuren. Die 9.741 vorhandenen
# stammen von `qwen3-vl` und werden nicht angetastet – welches Modell eine
# Zeile beschrieben hat, steht in `katalog.modell`.
[ai]
binding = "AI"

# BrickLink-Zugang als Secrets (nicht hier im Klartext):
#   wrangler secret put BL_CONSUMER_KEY
#   wrangler secret put BL_CONSUMER_SECRET
#   wrangler secret put BL_TOKEN
#   wrangler secret put BL_TOKEN_SECRET

# D1-Datenbank. Die database_id kommt aus `wrangler d1 create brickfolio-hub`
# und wird hier eingetragen.
[[d1_databases]]
binding = "DB"
database_name = "brickfolio-hub"
database_id = "5e56439d-43b7-4699-ad5a-6c36e145171b"

# Öffentlicher Hostname (Subdomain). Läuft NICHT hinter Cloudflare Access –
# der Hub authentifiziert selbst per Bearer-Token.
# [[routes]]
# pattern = "hub.brickfolio.cc/*"
# zone_name = "brickfolio.cc"

# HUB_BOOTSTRAP_SECRET wird als Secret gesetzt (nicht hier im Klartext):
#   wrangler secret put HUB_BOOTSTRAP_SECRET
