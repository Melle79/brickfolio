# Der Katalogdienst – neben der Hub-Konsole auf der NAS.
#
# Die echte `docker-compose.yml` steht **nicht** im Repo: Sie enthält die
# BrickLink-Zugangsdaten und die beiden Token. Diese Vorlage kopieren,
# ausfüllen, `docker compose up -d`.
services:
  katalog:
    build: .
    container_name: brickfolio-katalog
    restart: unless-stopped
    ports:
      # Nur im Heimnetz. 8320, damit es sich mit den Instanzen (8300–8303)
      # und der Hub-Konsole (8310) nicht beißt.
      - "8320:8320"
    volumes:
      # Hier liegt der Abzug. Ein benanntes Volume, damit ein Neubau des
      # Abbilds ihn nicht mitnimmt – darin stecken Tage an BrickLink-Abrufen
      # und rund ein Tag Grafikeinheit.
      - katalog-daten:/data
    environment:
      # --- BrickLink -----------------------------------------------------
      # Dieselben vier Werte wie bei den Instanzen. Sie bleiben damit auf der
      # NAS; kein fremder Dienst bekommt sie zu sehen.
      BL_CONSUMER_KEY: "..."
      BL_CONSUMER_SECRET: "..."
      BL_TOKEN: "..."
      BL_TOKEN_SECRET: "..."

      # --- Bilderkennung -------------------------------------------------
      # Ollama auf dem Mac mini. `qwen3-vl` ist gemessen das beste im Haus:
      # An sechs echten Figuren traf es Art und Teile durchweg – beim Dragon
      # Master „Umhang gelb, grüner Drache mit roten Flügeln", deckungsgleich
      # mit dem BrickLink-Namen. Rund 5,4 s je Figur.
      OLLAMA_URL: "http://192.168.0.220:11434"
      OLLAMA_BILD_MODEL: "qwen3-vl:latest"

      # --- Zugang --------------------------------------------------------
      # Steuern (Konsole). Ohne diesen Token verweigert der Dienst alles –
      # ein offener Katalogdienst könnte fremdes Kontingent verbrennen.
      ADMIN_TOKEN: "hier-etwas-langes-zufälliges"
      # Nur lesen (Instanzen holen den Abzug direkt von hier, falls sie
      # nicht über GitHub gehen). Getrennt, damit eine Instanz den Abzug
      # beziehen kann, ohne ihn steuern zu können.
      LESE_TOKEN: "hier-etwas-anderes-langes"

      # --- Veröffentlichen -----------------------------------------------
      # Hinaus gehen **nur** Nummer und unsere eigene Bildbeschreibung.
      # Name, Jahr, Kategorie und Bildadresse bleiben hier: Das ist
      # BrickLinks Inhalt, und dessen Weitergabe untersagen deren
      # Nutzungsbedingungen. Den Namen holt sich jede Installation über
      # ihren eigenen BrickLink-Token – ohne den tut sie ohnehin nichts.
      # Ein Unterordner im App-Repo, kein eigenes. Dafür tragen `tests.yml`
      # und `image.yml` ein `paths-ignore: katalog/**` – sonst liefe bei
      # jeder Veröffentlichung die Testsuite und ein neuer Image-Bau, und
      # die Instanzen sähen eine „neue Version" für eine reine
      # Datenänderung.
      GITHUB_REPO: "Melle79/brickfolio"
      GITHUB_BRANCH: "main"
      GITHUB_PFAD: "katalog/index.ndjson"
      # Feingranularer Token mit Schreibrecht **nur auf dieses eine Repo**
      # (Contents: Read and write). Nicht der Token, mit dem die App ihre
      # Fehlerberichte anlegt – der darf Issues, dieser darf Dateien.
      GITHUB_TOKEN: "..."

volumes:
  katalog-daten:
